<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0" stop-color="#4b2a9a"/>
      <stop offset="0.55" stop-color="#1c0a3e"/>
      <stop offset="1" stop-color="#0a0318"/>
    </radialGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ff7a"/>
      <stop offset="1" stop-color="#8fe82a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.8">
    <circle cx="18" cy="22" r="1.4"/><circle cx="104" cy="18" r="1.1"/><circle cx="112" cy="46" r="1.6"/>
    <circle cx="26" cy="96" r="1.2"/><circle cx="96" cy="110" r="1.3"/><circle cx="60" cy="12" r="1"/>
  </g>
  <!-- pouring stream -->
  <g fill="#a6ff3a" filter="url(#glow)">
    <circle cx="64" cy="20" r="3.2"/><circle cx="66" cy="31" r="3.4"/><circle cx="63" cy="42" r="3.4"/>
  </g>
  <!-- juice in the glass -->
  <path d="M43 68 L85 68 L80 104 L48 104 Z" fill="url(#juice)"/>
  <!-- glass -->
  <path d="M38 50 L90 50 L80 106 L48 106 Z" fill="none" stroke="#3ef0ff" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="46" y1="58" x2="52" y2="96" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
  <!-- antennae -->
  <path d="M42 50 Q36 40 34 34" fill="none" stroke="#3ef0ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M86 50 Q92 40 94 34" fill="none" stroke="#3ef0ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="34" cy="33" r="3.5" fill="#ff3fd2"/><circle cx="94" cy="33" r="3.5" fill="#ff3fd2"/>
  <!-- face -->
  <ellipse cx="56" cy="82" rx="4" ry="5" fill="#fff"/><ellipse cx="72" cy="82" rx="4" ry="5" fill="#fff"/>
  <circle cx="57" cy="83" r="2" fill="#120626"/><circle cx="73" cy="83" r="2" fill="#120626"/>
  <path d="M57 93 Q64 99 71 93" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
