<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120626">
<title>Moon Juice</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120626;
    --deep: #07020f;
    --cyan: #3ef0ff;
    --magenta: #ff3fd2;
    --lime: #a6ff3a;
    --violet: #7b4dff;
    --ink: #f3eaff;
    --muted: #9c8bc9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--deep);
    font-family: 'Chewy', 'Comic Sans MS', system-ui, sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* HUD */
  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 0;
    display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  #hud.hidden { display: none; }
  .hbtn {
    pointer-events: auto; width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(62,240,255,.55); background: rgba(18,6,38,.7);
    color: var(--cyan); font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  .hbtn:active { transform: scale(.92); }
  .hbtn svg { width: 20px; height: 20px; }
  #lvl { font-size: 22px; color: var(--ink); text-shadow: 0 0 10px rgba(255,63,210,.6); min-width: 70px; }
  #inkwrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  #inkbar {
    position: relative; height: 14px; border-radius: 7px; overflow: hidden;
    background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,63,210,.5);
  }
  #inkfill { position: absolute; inset: 0; background: linear-gradient(90deg, #ff3fd2, #ff8ae6); transform-origin: left; }
  .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(18,6,38,.85); }
  #inkstars { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 2px; }

  /* Screens */
  .screen {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .screen.hidden { display: none; }
  #title { background: transparent; }
  #title h1 {
    margin: 0; font-weight: 400; font-size: clamp(56px, 17vw, 88px); line-height: .9; text-align: center;
    color: var(--lime);
    text-shadow: 0 0 6px rgba(166,255,58,.9), 0 0 26px rgba(166,255,58,.55), 4px 5px 0 #4b1a8a;
    transform: rotate(-4deg);
  }
  #title h1 span { display: block; color: var(--cyan); text-shadow: 0 0 6px rgba(62,240,255,.9), 0 0 26px rgba(62,240,255,.5), 4px 5px 0 #4b1a8a; transform: translateX(28px); }
  #title p { margin: 0; color: var(--muted); font-size: 18px; text-align: center; max-width: 300px; }
  #grid {
    display: grid; grid-template-columns: repeat(5, 56px); gap: 8px; margin-top: 6px;
  }
  .tile {
    width: 56px; height: 56px; border-radius: 14px; border: 2px solid rgba(62,240,255,.5);
    background: rgba(18,6,38,.75); color: var(--ink); font: inherit; font-size: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    cursor: pointer; padding: 0;
  }
  .tile small { font-size: 10px; letter-spacing: 1px; color: var(--lime); min-height: 12px; }
  .tile.locked { opacity: .35; border-color: rgba(156,139,201,.4); cursor: default; }
  .tile.deep { border-color: rgba(255,63,210,.7); color: var(--magenta); }
  .tile.deep small { color: var(--magenta); letter-spacing: 0; }
  .tile:not(.locked):active { transform: scale(.93); }

  .panel {
    background: rgba(18,6,38,.9); border: 2px solid rgba(123,77,255,.7); border-radius: 24px;
    padding: 22px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 0 40px rgba(123,77,255,.35); min-width: 240px;
  }
  .panel h2 { margin: 0; font-weight: 400; font-size: 44px; }
  #winp h2 { color: var(--lime); text-shadow: 0 0 16px rgba(166,255,58,.6); }
  #failp h2 { color: var(--magenta); text-shadow: 0 0 16px rgba(255,63,210,.6); }
  .panel p { margin: 0; color: var(--muted); font-size: 17px; text-align: center; }
  #stars { font-size: 44px; letter-spacing: 6px; }
  #stars .on { color: #ffe14d; text-shadow: 0 0 12px rgba(255,225,77,.8); }
  #stars .off { color: rgba(255,255,255,.15); }
  .row { display: flex; gap: 10px; }
  .btn {
    font: inherit; font-size: 22px; padding: 10px 22px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--cyan); background: rgba(62,240,255,.12); color: var(--cyan);
  }
  .btn.primary { border-color: var(--lime); background: var(--lime); color: #1a0838; }
  .btn:active { transform: scale(.95); }
  .btn:focus-visible, .tile:focus-visible, .hbtn:focus-visible { outline: 3px solid #ffe14d; outline-offset: 2px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%);
    z-index: 6; font-size: 19px; color: var(--ink); pointer-events: none; text-align: center;
    text-shadow: 0 0 8px rgba(18,6,38,1), 0 0 14px rgba(18,6,38,1); transition: opacity .3s;
  }
</style>

<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <button class="hbtn" id="bHome" aria-label="Levels">
    <svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="2"/><rect x="11" y="2" width="7" height="7" rx="2"/><rect x="2" y="11" width="7" height="7" rx="2"/><rect x="11" y="11" width="7" height="7" rx="2"/></svg>
  </button>
  <div id="lvl">Level 1</div>
  <div id="inkwrap">
    <div id="inkbar"><div id="inkfill"></div><div class="tick" id="t3"></div><div class="tick" id="t2"></div></div>
  </div>
  <button class="hbtn" id="bRetry" aria-label="Restart level">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M15 2.5v3.6h-3.6"/></svg>
  </button>
  <button class="hbtn" id="bMute" aria-label="Sound on/off"></button>
</div>

<div id="title" class="screen">
  <h1>Moon<span>Juice</span></h1>
  <p>Draw one line. Fill the cup.</p>
  <div id="grid"></div>
</div>

<div id="win" class="screen hidden">

    <div id="stars"></div>
    <div class="row">
      <button class="btn" id="bReplay">Replay</button>
      <button class="btn primary" id="bNext">Next</button>
    </div>
  </div>
</div>

<div id="fail" class="screen hidden">
  <div class="panel" id="failp">
    <h2>Spilled!</h2>
    <p id="failwhy">The cup didn't fill up.</p>
    <div class="row">
      <button class="btn" id="bLevels">Levels</button>
      <button class="btn primary" id="bAgain">Try again</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
'use strict';
const { Engine, Bodies, Body, Composite, Query, Events } = Matter;

/* ---------- World geometry ---------- */
const W = 400, H = 700;          // logical world size; scaled to fit the screen
const TOP = 70;                  // band under the HUD where drawing is not allowed
const R = 5;                     // liquid particle radius
const STROKE_T = 10;             // drawn line thickness
const SAMPLE = 8;                // min spacing between sampled stroke points
const PEG_R = 9;
const BUMP_R = 13;
const DROP_DELAY = 700;         // ms after the pour starts before a hanging cup is released
const CUP = { h: 80, tw: 72, bw: 52, t: 7 };   // outer height, top width, bottom width, wall thickness
const SUBSTEP = 1000 / 120;
const MAX_SPEED = 12;            // speed cap (per base step) that prevents tunneling through thin walls
const DEG = Math.PI / 180;
const MAX_SPIN = 0.12;            // angular speed cap (rad per base step) that keeps tangled bodies from spinning up

/* ---------- Level data ----------
   plats: static slabs {x, y, w, h, a (deg), k: 'rock' | 'ice'}; x, y is the slab center.
   pegs:  static pins {x, y}.
   bumpers: static balls {x, y} that liquid bounces off.
   noz:   saucers {x, y, a (deg, 90 = straight down), dry}. The saucer is a solid body a line can
          rest on. dry: true pours nothing (an obstacle or a support only).
   cup:   {p: index of the slab it sits on, x, slide}; y and tilt come from the slab surface.
          slide: true makes the cup a free body (ice levels). Otherwise the cup is fixed.
          {x, y, drop: true} hangs the cup in the air at bottom-centre (x, y); it is released
          DROP_DELAY ms after the pour starts.
   ink:   max line length. drops: particles per dispenser. fill: target fill fraction. */
const GROUND = { x: 200, y: 760, w: 440, h: 280, a: 0, k: 'rock' };
const HAND = [
  // 1. Tutorial: a line resting on the pin and the cup rim
  { noz: [{ x: 120, y: 150, a: 90 }], plats: [GROUND], pegs: [{ x: 95, y: 380 }],
    cup: { p: 0, x: 290 }, ink: 430, drops: 100, fill: 0.5, tip: 'Draw a line from the pin to the cup' },
  // 2. Ice: the cup slides until something stops it
  { noz: [{ x: 180, y: 140, a: 90 }], plats: [{ x: 200, y: 470, w: 340, h: 26, a: 16, k: 'ice' }], pegs: [],
    cup: { p: 0, x: 140, slide: true }, ink: 160, drops: 90, fill: 0.5, tip: 'Ice is slippery. Stop the cup under the saucer' },
  // 3. Ledge spill onto a pinned ramp
  { noz: [{ x: 60, y: 140, a: 90 }], plats: [GROUND, { x: 70, y: 470, w: 140, h: 24, a: 8, k: 'rock' }, { x: 6, y: 430, w: 12, h: 70, a: 0, k: 'rock' }], pegs: [{ x: 175, y: 520 }],
    cup: { p: 0, x: 300 }, ink: 190, drops: 110, fill: 0.5 },
  // 4. Angled saucer: catch the arc
  { noz: [{ x: 50, y: 170, a: 40 }], plats: [GROUND], pegs: [{ x: 160, y: 400 }],
    cup: { p: 0, x: 330 }, ink: 400, drops: 110, fill: 0.5, tip: 'Catch the arc' },
  // 5. Over the pillar
  { noz: [{ x: 320, y: 140, a: 90 }], plats: [GROUND, { x: 200, y: 545, w: 24, h: 150, a: 0, k: 'rock' }], pegs: [{ x: 330, y: 380 }],
    cup: { p: 0, x: 100 }, ink: 400, drops: 110, fill: 0.5 },
  // 6. Hanging cup over a gap
  { noz: [{ x: 120, y: 150, a: 90 }], plats: [{ x: 30, y: 500, w: 60, h: 24, a: 0, k: 'rock' }, { x: 330, y: 640, w: 140, h: 120, a: 0, k: 'rock' }], pegs: [{ x: 200, y: 500 }],
    cup: { x: 120, y: 380, drop: true }, ink: 210, drops: 110, fill: 0.5, tip: 'The cup drops when you let go. Catch it' },
  // 7. Two saucers, one long ramp
  { noz: [{ x: 90, y: 140, a: 90 }, { x: 230, y: 140, a: 90 }], plats: [GROUND], pegs: [{ x: 60, y: 380 }],
    cup: { p: 0, x: 330 }, ink: 490, drops: 60, fill: 0.65, tip: 'Two saucers, one line' },
  // 8. A parked saucer is the only support
  { noz: [{ x: 90, y: 150, a: 90 }, { x: 160, y: 440, a: 90, dry: true }], plats: [GROUND], pegs: [],
    cup: { p: 0, x: 340 }, ink: 440, drops: 110, fill: 0.5, tip: 'Rest the line on the parked saucer' },
  // 9. Ice, steeper
  { noz: [{ x: 185, y: 140, a: 90 }], plats: [{ x: 210, y: 450, w: 360, h: 26, a: 20, k: 'ice' }], pegs: [],
    cup: { p: 0, x: 120, slide: true }, ink: 160, drops: 90, fill: 0.55 },
  // 10. Landing pad across two pins
  { noz: [{ x: 150, y: 140, a: 90 }], plats: [], pegs: [{ x: 85, y: 520 }, { x: 215, y: 520 }],
    cup: { x: 150, y: 380, drop: true }, ink: 260, drops: 110, fill: 0.5, tip: 'Give the cup somewhere to land' },
  // 11. Bumpers
  { noz: [{ x: 140, y: 140, a: 90 }], plats: [GROUND, { x: 340, y: 520, w: 120, h: 24, a: 0, k: 'rock' }], pegs: [], bumpers: [{ x: 140, y: 300 }, { x: 95, y: 380 }, { x: 185, y: 380 }],
    cup: { p: 1, x: 345 }, ink: 260, drops: 120, fill: 0.5, tip: 'Bouncy' },
  // 12. Deflector
  { noz: [{ x: 200, y: 140, a: 90 }], plats: [GROUND, { x: 200, y: 330, w: 60, h: 18, a: -30, k: 'rock' }], pegs: [{ x: 120, y: 420 }],
    cup: { p: 0, x: 320 }, ink: 430, drops: 110, fill: 0.55 },
  // 13. Angled saucer over a pillar
  { noz: [{ x: 360, y: 180, a: 150 }], plats: [GROUND, { x: 200, y: 560, w: 24, h: 120, a: 0, k: 'rock' }], pegs: [{ x: 300, y: 430 }],
    cup: { p: 0, x: 90 }, ink: 350, drops: 110, fill: 0.5 },
  // 14. Ice chute and a bridge
  { noz: [{ x: 70, y: 140, a: 90 }], plats: [GROUND, { x: 120, y: 380, w: 200, h: 24, a: 22, k: 'ice' }, { x: 350, y: 540, w: 100, h: 24, a: 0, k: 'rock' }], pegs: [],
    cup: { p: 2, x: 350 }, ink: 190, drops: 110, fill: 0.55, tip: 'Bridge the gap' },
  // 15. Hanging cup at a cliff edge
  { noz: [{ x: 270, y: 140, a: 90 }], plats: [{ x: 100, y: 560, w: 200, h: 24, a: 0, k: 'rock' }], pegs: [{ x: 330, y: 560 }],
    cup: { x: 270, y: 400, drop: true }, ink: 270, drops: 110, fill: 0.5, tip: 'Extend the ledge' },
  // 16. Bridge across two parked saucers
  { noz: [{ x: 200, y: 140, a: 90 }, { x: 110, y: 400, a: 90, dry: true }, { x: 290, y: 470, a: 90, dry: true }], plats: [GROUND], pegs: [],
    cup: { p: 0, x: 350 }, ink: 370, drops: 110, fill: 0.5, tip: 'Two saucers, one bridge' },
  // 17. Two pins, one steep ramp
  { noz: [{ x: 330, y: 140, a: 90 }], plats: [GROUND], pegs: [{ x: 350, y: 300 }, { x: 230, y: 420 }],
    cup: { p: 0, x: 80 }, ink: 550, drops: 110, fill: 0.55 },
  // 18. Angled saucer into bumpers
  { noz: [{ x: 40, y: 160, a: 35 }], plats: [GROUND], pegs: [], bumpers: [{ x: 220, y: 330 }, { x: 300, y: 400 }, { x: 180, y: 430 }],
    cup: { p: 0, x: 350 }, ink: 335, drops: 120, fill: 0.5 },
  // 19. Hanging cup onto ice
  { noz: [{ x: 215, y: 140, a: 90 }], plats: [{ x: 200, y: 520, w: 340, h: 26, a: 18, k: 'ice' }], pegs: [],
    cup: { x: 110, y: 330, drop: true }, ink: 160, drops: 100, fill: 0.5, tip: 'Catch, then stop' },
  // 20. Ledge over a pillar
  { noz: [{ x: 340, y: 130, a: 90 }], plats: [GROUND, { x: 200, y: 530, w: 24, h: 180, a: 0, k: 'rock' }, { x: 340, y: 360, w: 100, h: 22, a: 0, k: 'rock' }, { x: 394, y: 330, w: 12, h: 60, a: 0, k: 'rock' }], pegs: [],
    cup: { p: 0, x: 90 }, ink: 390, drops: 110, fill: 0.6 },
  // 21. Fountain over a wall
  { noz: [{ x: 70, y: 520, a: -60, v: 9 }], plats: [GROUND, { x: 200, y: 550, w: 24, h: 140, a: 0, k: 'rock' }], pegs: [],
    cup: { p: 0, x: 362 }, ink: 220, drops: 120, fill: 0.5, tip: 'Fountain' },
  // 22. Landing pad on a parked saucer
  { noz: [{ x: 225, y: 140, a: 90 }, { x: 200, y: 520, a: 90, dry: true }], plats: [GROUND], pegs: [{ x: 110, y: 510 }],
    cup: { x: 225, y: 380, drop: true }, ink: 280, drops: 110, fill: 0.5, tip: 'Make a landing pad' },
  // 23. Ledge spill across two pins
  { noz: [{ x: 55, y: 130, a: 90 }], plats: [GROUND, { x: 55, y: 270, w: 110, h: 22, a: 6, k: 'rock' }, { x: 6, y: 240, w: 12, h: 60, a: 0, k: 'rock' }], pegs: [{ x: 170, y: 450 }, { x: 270, y: 500 }],
    cup: { p: 0, x: 345 }, ink: 290, drops: 110, fill: 0.6 },
  // 24. Ice, long slide
  { noz: [{ x: 215, y: 140, a: 90 }], plats: [{ x: 180, y: 420, w: 330, h: 26, a: 20, k: 'ice' }], pegs: [],
    cup: { p: 0, x: 90, slide: true }, ink: 160, drops: 100, fill: 0.6, tip: 'Make the cup stop under the saucer' },
  // 25. Catch the cup under the arc
  { noz: [{ x: 40, y: 150, a: 35, v: 7 }], plats: [{ x: 110, y: 570, w: 220, h: 24, a: 0, k: 'rock' }], pegs: [{ x: 370, y: 557 }],
    cup: { x: 262, y: 420, drop: true }, ink: 280, drops: 110, fill: 0.55, tip: 'Catch the cup under the arc' },
];

/* Seeded generator for levels past the hand-built set. Each layout is a jittered copy of a
   hand-built pattern, and genSolution() builds the matching reference stroke from the same
   geometry so every generated level can be checked automatically. */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const GEN_TYPES = ['peg', 'ice', 'ledge', 'twin', 'drop', 'arc'];
/* Seeds whose layout failed the automated check (python3 tools/check.py gen). Level n uses the
   n-th seed that is not in this set, so the list can grow without changing earlier levels. */
const GEN_SKIP = new Set([]);
function genSeed(n) {
  let seed = HAND.length, k = HAND.length;
  while (k < n) { seed++; if (!GEN_SKIP.has(seed)) k++; }
  return seed;
}
function genParams(n) {
  const r = rng(genSeed(n) * 2654435761);
  const j = (v, s) => Math.round(v + (r() * 2 - 1) * s);
  const type = GEN_TYPES[Math.floor(r() * GEN_TYPES.length)];
  const mirror = r() < 0.5;
  const k = n - HAND.length;
  const tight = Math.min(0.12, k * 0.008);         // ink budget shrinks slowly as levels climb
  let P;
  if (type === 'peg') P = { nx: j(120, 25), px: j(95, 15), py: j(380, 40), cx: j(290, 20) };
  else if (type === 'ice') P = { ang: j(19, 3), cx: j(125, 10), bx: j(215, 15), sy: j(460, 25) };
  else if (type === 'ledge') { const ly = j(450, 20); P = { ly, px: j(175, 10), py: ly + j(45, 8), cx: j(310, 15) }; }
  else if (type === 'twin') P = { n1: j(90, 15), n2: j(235, 20), px: j(60, 10), py: j(380, 30), cx: j(320, 10) };
  else if (type === 'drop') { const ly = j(500, 30); P = { lx: j(30, 8), ly, px: j(205, 15), py: ly + j(0, 10), cx: j(120, 15) }; }
  else P = { nx: j(50, 10), ny: j(170, 20), na: j(40, 5), px: j(160, 10), py: j(410, 15), cx: j(330, 10) };
  return { type, mirror, tight, P };
}
function genLevel(n) {
  const { type, mirror, tight, P } = genParams(n);
  let L;
  if (type === 'peg') {
    L = { noz: [{ x: P.nx, y: 150, a: 90 }], plats: [GROUND], pegs: [{ x: P.px, y: P.py }],
          cup: { p: 0, x: P.cx }, ink: 480, drops: 110, fill: 0.5 };
  } else if (type === 'ice') {
    const rest = P.bx - 40 + Math.round(80 * Math.sin(P.ang * DEG));   // rim centre once the cup rests against the stopper
    L = { noz: [{ x: rest, y: 140, a: 90 }], plats: [{ x: 200, y: P.sy, w: 340, h: 26, a: P.ang, k: 'ice' }], pegs: [],
          cup: { p: 0, x: P.cx, slide: true }, ink: 180, drops: 100, fill: 0.55 };
  } else if (type === 'ledge') {
    L = { noz: [{ x: 60, y: 140, a: 90 }], plats: [GROUND, { x: 70, y: P.ly, w: 140, h: 24, a: 8, k: 'rock' }, { x: 6, y: P.ly - 40, w: 12, h: 70, a: 0, k: 'rock' }], pegs: [{ x: P.px, y: P.py }],
          cup: { p: 0, x: P.cx }, ink: 220, drops: 120, fill: 0.5 };
  } else if (type === 'twin') {
    L = { noz: [{ x: P.n1, y: 140, a: 90 }, { x: P.n2, y: 140, a: 90 }], plats: [GROUND], pegs: [{ x: P.px, y: P.py }],
          cup: { p: 0, x: P.cx }, ink: 520, drops: 60, fill: 0.5 };
  } else if (type === 'drop') {
    L = { noz: [{ x: P.cx, y: 150, a: 90 }], plats: [{ x: P.lx, y: P.ly, w: 60, h: 24, a: 0, k: 'rock' }], pegs: [{ x: P.px, y: P.py }],
          cup: { x: P.cx, y: 380, drop: true }, ink: 280, drops: 110, fill: 0.5 };
  } else {
    L = { noz: [{ x: P.nx, y: P.ny, a: P.na }], plats: [GROUND], pegs: [{ x: P.px, y: P.py }],
          cup: { p: 0, x: P.cx }, ink: 420, drops: 110, fill: 0.5 };
  }
  L.ink = Math.round(L.ink * (1 - tight));
